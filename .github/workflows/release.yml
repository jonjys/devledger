name: Release

# Publishes downloadable installers to the GitHub Releases page.
#
# Trigger it by pushing a version tag, e.g.:
#   git tag v0.6.0 && git push origin v0.6.0
# or run it manually from the Actions tab and type a tag name.
#
# Windows produces the NSIS .exe and the .msi; Linux produces the .deb and the
# AppImage (the bundle targets configured in apps/desktop/src-tauri/tauri.conf.json).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0). Created if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the desktop app and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "DevLedger ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: |
            Download the installer for your platform from the assets below.

            - Windows: `.exe` (NSIS installer) or `.msi`
            - Linux: `.AppImage` (portable) or `.deb`

            DevLedger is local-first: everything stays encrypted on your machine.
          releaseDraft: false
          prerelease: false
