name: Format document import

on:
  push:
    branches: [astra/smart-document-import]
    paths: [.github/workflows/format-document.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format changed Rust sources
        run: |
          cargo fmt --all
          git diff --check
          git add -- crates/devledger-core/src/paste/document_v2.rs crates/devledger-core/src/paste/mod.rs
          if ! git diff --cached --quiet; then
            git -c user.name='DevLedger CI' -c user.email='actions@users.noreply.github.com' commit -m 'Format receipt analyzer with rustfmt'
            git push origin HEAD:astra/smart-document-import
          fi
