[package]
name = "devledger-connect"
description = "DevLedger connectors. The only crate in the workspace that opens a socket."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Path-only: never published, and a version pin would break on each bump.
devledger-core = { path = "../devledger-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.26.1"
