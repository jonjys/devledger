[package]
name = "devledger-core"
description = "DevLedger security, parsing and persistence core. No networking, no UI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
once_cell = "1.21.4"
rand = "0.10.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
