[package]
name = "devledger-desktop"
description = "DevLedger desktop shell (Tauri v2)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "devledger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Path-only: this crate is never published, and pinning a version here
# would break on every workspace version bump.
devledger-core = { path = "../../../crates/devledger-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
